name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tap test file selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 25.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm time machine registry
        run: npm config set registry https://:2026-05-08T05%3A41%3A43.205000Z@time-machines-npm.sealsecurity.io/

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c -t0 ${{ inputs.test-filter }}

      - name: Pack tarball
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm pack

      - name: Upload tarball
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: brace-expansion-*.tgz
          if-no-files-found: error
